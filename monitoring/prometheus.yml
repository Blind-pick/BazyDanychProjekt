global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cinema_api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: jmeter
    static_configs:
      - targets: ['host.docker.internal:9270']
    metrics_path: /metrics
