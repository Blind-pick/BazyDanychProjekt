pg_stat_statements:
  query: |
    SELECT
      pg_get_userbyid(userid)                                      AS usename,
      queryid::text                                                AS queryid,
      left(regexp_replace(query, '\s+', ' ', 'g'), 120)            AS short_query,
      calls                                                        AS calls,
      round(total_exec_time::numeric, 2)                           AS total_exec_ms,
      round(mean_exec_time::numeric, 2)                            AS mean_exec_ms,
      round(max_exec_time::numeric, 2)                             AS max_exec_ms,
      rows                                                         AS rows
    FROM pg_stat_statements
    WHERE query NOT LIKE '%pg_stat_statements%'
      AND query NOT LIKE '%pg_catalog%'
    ORDER BY total_exec_time DESC
    LIMIT 20
  master: true
  metrics:
    - usename:
        usage: "LABEL"
        description: "Uzytkownik wykonujacy zapytanie"
    - queryid:
        usage: "LABEL"
        description: "Identyfikator znormalizowanego zapytania"
    - short_query:
        usage: "LABEL"
        description: "Skrocony tekst zapytania (120 znakow)"
    - calls:
        usage: "COUNTER"
        description: "Liczba wywolan zapytania"
    - total_exec_ms:
        usage: "COUNTER"
        description: "Laczny czas wykonania w ms"
    - mean_exec_ms:
        usage: "GAUGE"
        description: "Sredni czas wykonania w ms"
    - max_exec_ms:
        usage: "GAUGE"
        description: "Maksymalny czas wykonania w ms"
    - rows:
        usage: "COUNTER"
        description: "Laczna liczba zwroconych/zmienionych wierszy"

pg_stat_activity_states:
  query: |
    SELECT
      coalesce(state, 'unknown') AS state,
      count(*)                   AS connections,
      coalesce(round(extract(epoch FROM max(now() - state_change))::numeric, 2), 0) AS max_state_seconds
    FROM pg_stat_activity
    WHERE datname IS NOT NULL
    GROUP BY state
  master: true
  metrics:
    - state:
        usage: "LABEL"
        description: "Stan polaczenia"
    - connections:
        usage: "GAUGE"
        description: "Liczba polaczen w danym stanie"
    - max_state_seconds:
        usage: "GAUGE"
        description: "Najdluzszy czas trwania danego stanu w sekundach"

pg_locks_waiting:
  query: |
    SELECT
      mode                                  AS lock_mode,
      count(*) FILTER (WHERE granted)       AS granted,
      count(*) FILTER (WHERE NOT granted)   AS waiting
    FROM pg_locks
    GROUP BY mode
  master: true
  metrics:
    - lock_mode:
        usage: "LABEL"
        description: "Tryb blokady"
    - granted:
        usage: "GAUGE"
        description: "Liczba przyznanych blokad"
    - waiting:
        usage: "GAUGE"
        description: "Liczba blokad oczekujacych (kontencja)"
