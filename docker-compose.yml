services:
  db:
    image: postgres:15-alpine
    container_name: cinema_db
    environment:
      POSTGRES_DB: ${DB_NAME:-kino}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pswd}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,auto_explain"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_min_duration_statement=${DB_LOG_MIN_MS:-500}"
      - "-c"
      - "auto_explain.log_min_duration=${DB_AUTOEXPLAIN_MS:-2000}"
      - "-c"
      - "auto_explain.log_analyze=off"
      - "-c"
      - "auto_explain.log_nested_statements=on"
      - "-c"
      - "shared_buffers=${DB_SHARED_BUFFERS:-32MB}"
      - "-c"
      - "work_mem=${DB_WORK_MEM:-1MB}"
      - "-c"
      - "maintenance_work_mem=${DB_MAINT_WORK_MEM:-64MB}"
      - "-c"
      - "effective_cache_size=${DB_EFFECTIVE_CACHE:-128MB}"
      - "-c"
      - "max_connections=${DB_MAX_CONNECTIONS:-150}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-6.0}"
          memory: ${DB_MEMORY:-6g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema_network

  db_replica:
    image: postgres:15-alpine
    container_name: cinema_db_replica
    environment:
      PGPASSWORD: replpass
      PGDATA: /var/lib/postgresql/data
    entrypoint: ["sh", "/usr/local/bin/replica_entrypoint.sh"]
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "shared_buffers=${DB_SHARED_BUFFERS:-32MB}"
      - "-c"
      - "work_mem=${DB_WORK_MEM:-1MB}"
      - "-c"
      - "effective_cache_size=${DB_EFFECTIVE_CACHE:-128MB}"
      - "-c"
      - "max_connections=${DB_MAX_CONNECTIONS:-150}"
      - "-c"
      - "hot_standby=on"
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./scripts/replica_entrypoint.sh:/usr/local/bin/replica_entrypoint.sh:ro
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-6.0}"
          memory: ${DB_MEMORY:-6g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - cinema_network
    restart: unless-stopped

  api:
    build: .
    container_name: cinema_api
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_started
    environment:
      DB_HOST: db
      DB_REPLICA_HOST: ${DB_REPLICA_HOST:-db_replica}
      DB_REPLICA_PORT: ${DB_REPLICA_PORT:-5432}
      DB_NAME: ${DB_NAME:-kino}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pswd}
      DB_PORT: 5432
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-12}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      API_WORKERS: ${API_WORKERS:-4}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks:
      - cinema_network

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-pswd}@db:5432/${DB_NAME:-kino}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./monitoring/postgres_exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cinema_network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg
    command:
      - "--housekeeping_interval=5s"
      - "--docker_only=true"
      - "--disable_metrics=tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp,memory_numa"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - cinema_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: cinema_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cinema_network
    depends_on:
      - api
      - postgres_exporter
      - cadvisor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: cinema_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - cinema_network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  pgdata_replica:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  cinema_network:
    driver: bridge
